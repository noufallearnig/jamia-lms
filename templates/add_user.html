<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Account | Jamia Imam Navavi-ra LMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Dedicated Layout Styling for Auth / Creation Pages */
        .auth-wrapper {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .auth-brand {
            margin-bottom: 24px;
            text-align: center;
        }

        .auth-brand h2 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .auth-brand p {
            margin: 6px 0 0 0;
            font-size: 0.85rem;
            opacity: 0.75;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
            border-radius: 18px !important;
            box-sizing: border-box;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-icon-badge {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .auth-header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .form-group label i {
            color: #38bdf8;
            font-size: 0.85rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px !important;
            font-size: 0.92rem !important;
        }

        .btn-create-account {
            width: 100%;
            margin-top: 10px;
            padding: 12px !important;
            font-size: 0.95rem !important;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .back-link {
            text-decoration: none;
            font-size: 0.86rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0.85;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .back-link:hover {
            opacity: 1;
            transform: translateX(-3px);
        }

        /* Alert notifications */
        .flash-msg {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: center;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <!-- Top Institutional Brand -->
        <div class="auth-brand">
            <h2>Jamia Imam Navavi-ra LMS</h2>
            <p>Administrative User Provisioning</p>
        </div>

        <!-- Centered Creation Card -->
        <div class="card auth-card">
            <div class="auth-header">
                <div class="auth-icon-badge">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1>Create a New Account</h1>
            </div>

            <!-- Flash Error/Success Messages if any -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-msg">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="/add_user">
                <!-- Account Role -->
                <div class="form-group">
                    <label for="role"><i class="fa-solid fa-id-badge"></i> Account Role</label>
                    <select name="role" id="role" required>
                        <option value="student" selected>Student</option>
                        <option value="teacher">Teacher</option>
                        <option value="admin">Administrator</option>
                        <option value="parent">Parent</option> <!-- THIS IS THE NEW PARENT OPTION -->
                    </select>
                </div>

                <!-- Username -->
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user"></i> New Username</label>
                    <input type="text" name="username" id="username" placeholder="e.g. noufal" autocomplete="off" required>
                </div>

                <!-- Temporary Password -->
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-key"></i> Temporary Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter secure temporary password" autocomplete="new-password" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-action btn-create-account">
                    <i class="fa-solid fa-shield-halved"></i> Create Account
                </button>

                <!-- Back Navigation -->
                <div class="auth-footer">
                    <a href="/admin" class="back-link">
                        <i class="fa-solid fa-arrow-left"></i> Back to Admin Dashboard
                    </a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
