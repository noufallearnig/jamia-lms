<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - LMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Security Center</h1>
    <h2>Update Your Password</h2>
    
    <form method="POST" style="width: 300px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <p style="text-align: left; margin-bottom: 5px;">Current Password:</p>
        <input type="password" name="old_password" required style="width: 100%; padding: 8px; margin-bottom: 15px;">
        
        <p style="text-align: left; margin-bottom: 5px;">New Password:</p>
        <input type="password" name="new_password" required style="width: 100%; padding: 8px; margin-bottom: 20px;">
        
        <button type="submit" style="padding: 10px 20px; background-color: #2c3e50; color: white; width: 100%; border: none; cursor: pointer;">Secure Update</button>
    </form>
    
    <br>
    <p><a href="/login" style="color: #7f8c8d; text-decoration: none;">Cancel and Go Back</a></p>
</body>
</html>
