<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Jamia Imam Navavi-ra LMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=18.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0f1d38 0%, #05080f 85%) !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #f8fafc;
        }

        .login-card {
            background: #0f172a !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 20px !important;
            padding: 42px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6) !important;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }

        /* High-Definition Institutional Logo */
        .login-logo {
            width: 90px;
            height: auto;
            margin: 0 auto 16px auto;
            display: block;
            filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.65));
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            transition: transform 0.25s ease;
        }

        .login-logo:hover {
            transform: scale(1.05);
        }

        .login-card h2 {
            color: #ffffff !important;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .login-card p {
            color: #94a3b8 !important;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            background: #1e293b !important;
            border: 1.5px solid #334155 !important;
            color: #ffffff !important;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.25) !important;
        }

        .btn-submit {
            background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
            color: #ffffff !important;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 18px rgba(37, 99, 235, 0.35);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af) !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(37, 99, 235, 0.5);
        }

        .flash-box {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .flash-error {
            background: rgba(239, 68, 68, 0.15) !important;
            color: #fca5a5 !important;
            border: 1px solid rgba(239, 68, 68, 0.35) !important;
        }
        .flash-success {
            background: rgba(16, 185, 129, 0.15) !important;
            color: #86efac !important;
            border: 1px solid rgba(16, 185, 129, 0.35) !important;
        }

        .back-link {
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #94a3b8;
        }
    </style>
</head>
<body class="dark-mode">
    <div class="login-card">
        <div>
            <img src="{{ url_for('static', filename='JAMIA-IMAM-NAVAVI-RA_LOGO.png') }}" alt="Jamia Imam Navavi Logo" class="login-logo">
            <h2>Sign In to LMS</h2>
            <p>Jamia Imam Navavi-ra Central Portal</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-box flash-{{ category }}">
                        <i class="fa-solid {% if category == 'success' %}fa-circle-check{% else %}fa-circle-exclamation{% endif %}"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}" style="display: flex; flex-direction: column; gap: 16px;">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter your username" autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Continue to Portal</span>
            </button>
        </form>

        <a href="{{ url_for('home') }}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Welcome Screen</span>
        </a>
    </div>
</body>
</html>
