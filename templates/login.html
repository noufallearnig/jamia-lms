<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Jamia Enterprise LMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { 
            background: radial-gradient(circle at top left, #0b1121, #05080f); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #f8fafc;
        }
        .login-wrapper {
            background: linear-gradient(145deg, #131e33, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .login-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #10b981, #0ea5e9);
        }
        /* Updated Logo CSS */
        .logo-area img { 
            width: 85px; /* Adjust size based on your logo */
            height: auto; 
            margin-bottom: 15px; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); /* Adds a premium soft shadow to the logo */
        }
        .logo-area h1 { font-size: 24px; font-weight: 800; margin-bottom: 5px; letter-spacing: 1px; }
        .logo-area p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .modern-input {
            width: 100%; padding: 14px 15px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; color: #f8fafc; font-size: 15px;
            transition: all 0.3s ease;
        }
        .modern-input:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); background: rgba(0, 0, 0, 0.4); }
        
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
            margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3); }
        
        .flash-error {
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
            margin-bottom: 20px; display: flex; align-items: center; gap: 8px; justify-content: center;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="logo-area">
            <!-- Fetching your specific logo from the static folder -->
            <img src="{{ url_for('static', filename='JAMIA-IMAM-NAVAVI-RA_LOGO.png') }}" alt="Jamia LMS Logo">
            <h1>JAMIA LMS</h1>
            <p>Enterprise Faculty & Student Portal</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-error"><i class="fa-solid fa-circle-exclamation"></i> {{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" class="modern-input" placeholder="Enter your username" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" class="modern-input" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket" style="margin-right: 8px;"></i> Secure Login</button>
        </form>
    </div>

</body>
</html>
